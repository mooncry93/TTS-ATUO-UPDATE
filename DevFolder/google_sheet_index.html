<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #161a23;
      --panel-border: rgba(255, 255, 255, 0.05);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --glass: rgba(22, 26, 35, 0.7);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
      background-image: radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 2.25rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    
    /* Layout Grid */
    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
    }
    
    @media (max-width: 900px) {
      body {
        padding: 1rem 0.5rem;
      }
      header {
        margin-bottom: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      h1 {
        font-size: 1.6rem;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
      .card {
        padding: 1.25rem 1rem;
      }
      .presets {
        grid-template-columns: repeat(4, 1fr);
      }
      th, td {
        padding: 0.75rem 0.4rem;
        font-size: 0.8rem;
      }
      .key-truncated {
        max-width: 70px;
      }
      .hwid-val {
        font-size: 0.8rem;
      }
      .switch {
        width: 38px;
        height: 20px;
      }
      .slider:before {
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
      }
      input:checked + .slider:before {
        transform: translateX(18px);
      }
    }
    
    /* Glassmorphism Panel */
    .card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    
    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #fff;
    }
    
    /* Input Elements */
    .form-group {
      margin-bottom: 1.25rem;
    }
    
    label {
      display: block;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="text"], input[type="date"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    
    input[type="text"]:focus, input[type="date"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
    }
    
    /* Presets Row */
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    
    .preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.5rem 0.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      text-align: center;
    }
    
    .preset-btn:hover {
      background: rgba(0, 242, 254, 0.1);
      color: var(--primary);
      border-color: var(--primary);
    }
    
    /* Buttons */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      padding: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
    }
    
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.35);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    /* Table styling */
    .table-container {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    
    th, td {
      padding: 1.25rem 1rem;
      border-bottom: 1px solid var(--panel-border);
    }
    
    th {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }
    
    .hwid-val {
      font-family: monospace;
      font-weight: bold;
      color: #fff;
    }
    
    .key-truncated {
      font-family: monospace;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      vertical-align: middle;
    }
    
    .key-truncated:hover {
      color: var(--primary);
    }
    
    /* Status Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
      vertical-align: middle;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: #fff;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: var(--success);
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    
    .badge-active {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    
    .badge-inactive {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }
    
    /* Actions */
    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.25rem;
      margin-left: 0.75rem;
      transition: color 0.2s;
      vertical-align: middle;
    }
    
    .action-btn:hover {
      color: var(--danger);
    }
    
    /* Toast alerts */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      border: 1px solid var(--panel-border);
      border-left: 4px solid var(--primary);
      padding: 1rem 1.5rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      color: #fff;
      display: none;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Spinner */
    .loader {
      border: 2px solid #1e293b;
      border-top: 2px solid var(--primary);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-left: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  
  <div class="container">
    <header>
      <div>
        <h1>Digital_TTS Studio</h1>
        <div class="subtitle">Secure Licensing Management Console (RSA signed)</div>
      </div>
      <div>
        <span id="loading-spinner" style="display: none; color: var(--text-muted); font-size: 0.9rem;">
          Syncing Sheet... <div class="loader"></div>
        </span>
      </div>
    </header>
    
    <div class="grid">
      <!-- Create Panel -->
      <div class="card" style="align-self: start;">
        <div class="card-title">Register License</div>
        
        <div class="form-group">
          <label>Hardware ID (HWID)</label>
          <input type="text" id="hwid" placeholder="THY-XXXX-XXXX-XXXX-XXXX" maxlength="23">
        </div>
        
        <div class="form-group">
          <label>Expiry Period</label>
          <div class="presets">
            <button class="preset-btn" onclick="applyPreset(30)">30 D</button>
            <button class="preset-btn" onclick="applyPreset(90)">90 D</button>
            <button class="preset-btn" onclick="applyPreset(365)">1 Y</button>
            <button class="preset-btn" onclick="applyPreset('lifetime')">Lftm</button>
          </div>
          <input type="date" id="expiry-date">
        </div>
        
        <button class="btn" id="generate-btn" onclick="generateKey()">Generate & Save</button>
      </div>
      
      <!-- List Panel -->
      <div class="card">
        <div class="card-title">All Registered Keys</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Hardware ID</th>
                <th>License Key (Click copy)</th>
                <th>Expiry</th>
                <th>Status Toggle</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="license-table-body">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading active keys...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast-notif">Notification Message</div>

  <script>
    // Load database on start
    document.addEventListener("DOMContentLoaded", function() {
      fetchLicenses();
    });
    
    function showToast(message, isError = false) {
      const toast = document.getElementById("toast-notif");
      toast.innerText = message;
      toast.style.borderLeftColor = isError ? "var(--danger)" : "var(--primary)";
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 3500);
    }
    
    function toggleLoader(show) {
      document.getElementById("loading-spinner").style.display = show ? "inline-block" : "none";
    }
    
    // Quick period selectors
    function applyPreset(days) {
      const dateInput = document.getElementById("expiry-date");
      if (days === 'lifetime') {
        dateInput.value = "";
        dateInput.type = "text";
        dateInput.value = "lifetime";
      } else {
        dateInput.type = "date";
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + days);
        dateInput.value = targetDate.toISOString().split('T')[0];
      }
    }
    
    // Fetch licenses database
    function fetchLicenses() {
      toggleLoader(true);
      google.script.run
        .withSuccessHandler(function(licenses) {
          toggleLoader(false);
          const tbody = document.getElementById("license-table-body");
          tbody.innerHTML = "";
          
          if (licenses.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No licenses found. Add one on the left!</td></tr>`;
            return;
          }
          
          licenses.forEach(function(lic) {
            const isChecked = lic.status === "Active" ? "checked" : "";
            const badgeClass = lic.status === "Active" ? "badge-active" : "badge-inactive";
            
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="hwid-val">${lic.hwid}</td>
              <td>
                <span class="key-truncated" title="Click to copy full key" onclick="copyToClipboard('${lic.key}')">${lic.key}</span>
              </td>
              <td><span style="font-weight: 500;">${lic.expiry}</span></td>
              <td>
                <label class="switch">
                  <input type="checkbox" ${isChecked} onchange="toggleStatus('${lic.hwid}')">
                  <span class="slider"></span>
                </label>
                <span class="badge ${badgeClass}">${lic.status}</span>
              </td>
              <td>
                <button class="action-btn" title="Delete License" onclick="deleteLicense('${lic.hwid}')">
                  <svg style="width: 18px; height: 18px; vertical-align: middle;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                  </svg>
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          showToast("Failed to fetch licenses: " + err, true);
        })
        .getLicenses();
    }
    
    // Copy key helper
    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast("License key copied to clipboard!");
    }
    
    // Submit registration form
    function generateKey() {
      const hwid = document.getElementById("hwid").value.trim().toUpperCase();
      const expiryDateInput = document.getElementById("expiry-date").value.trim();
      
      if (!hwid) {
        showToast("Please enter client HWID.", true);
        return;
      }
      
      // Standard layout enforcement
      if (hwid.length !== 23 || !hwid.startsWith("THY-")) {
        if (!confirm("Hardware ID doesn't match standard THY-XXXX-XXXX-XXXX-XXXX format. Force generate anyway?")) {
          return;
        }
      }
      
      if (!expiryDateInput) {
        showToast("Please choose an expiry period or select a date.", true);
        return;
      }
      
      toggleLoader(true);
      document.getElementById("generate-btn").disabled = true;
      
      google.script.run
        .withSuccessHandler(function(res) {
          toggleLoader(false);
          document.getElementById("generate-btn").disabled = false;
          // Clear inputs
          document.getElementById("hwid").value = "";
          document.getElementById("expiry-date").value = "";
          showToast("License key generated and saved successfully!");
          fetchLicenses();
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          document.getElementById("generate-btn").disabled = false;
          showToast("Generation failed: " + err, true);
        })
        .createLicense(hwid, expiryDateInput);
    }
    
    // 1-Click Status Toggle
    function toggleStatus(hwid) {
      toggleLoader(true);
      google.script.run
        .withSuccessHandler(function(newStatus) {
          toggleLoader(false);
          showToast(`License for ${hwid} set to ${newStatus}`);
          fetchLicenses();
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          showToast("Failed to toggle license: " + err, true);
          fetchLicenses();
        })
        .toggleLicenseStatus(hwid);
    }
    
    // Delete license
    function deleteLicense(hwid) {
      if (!confirm(`Are you sure you want to permanently delete the license for ${hwid}?`)) {
        return;
      }
      toggleLoader(true);
      google.script.run
        .withSuccessHandler(function() {
          toggleLoader(false);
          showToast("License removed successfully.");
          fetchLicenses();
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          showToast("Failed to remove license: " + err, true);
        })
        .removeLicense(hwid);
    }
  </script>
</body>
</html>
